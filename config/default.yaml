app:
  camera_index: 0
  width: 1920
  height: 1080
  ui_fps_target: 30
  locale: zh
  # no-microphone text command box (Tk IME window + in-frame bar)
  text_input: true
  text_input_always: false     # true = open IME window even with mic

# ---------------------------------------------------------------------------
# Depth-guided zero-shot object localization (零样本物体定位)
# Replaces YOLO's role in identify/remember: finds the nearest object via
# monocular depth estimation — completely category-free.
# References: DepSeg (arXiv 2512.05529), ZISVFM (arXiv 2502.03266)
# Prep: python tools/prepare_models.py --depth
# ---------------------------------------------------------------------------
depth:
  enabled: true
  model_path: models/depth_anything_v2/depth_anything_v2_vits.onnx
  input_size: 518               # DA-V2 Small native input
  near_percentile: 80.0         # take nearest 20% of pixels as "object candidates"
  min_area_frac: 0.005          # discard regions smaller than 0.5% of frame
  max_area_frac: 0.60           # discard regions larger than 60% (likely background)
  expand_ratio: 0.06            # expand bbox by 6% before cropping
  show_depth_window: true       # open a separate depth heatmap window for demo
  # CPU tuning: DA-V2 inference is ~600-850ms and runs on its own thread.
  # Cap ONNX threads so it does not starve the UI/streaming threads.
  onnx_threads: 4               # intra-op threads for DA-V2 (was: all cores)
  refresh_interval_sec: 0.5     # target depth refresh period
  min_idle_sec: 0.12            # guaranteed idle slice after each inference
  # MobileSAM mask refinement: depth centroid → point prompt → pixel-precise mask
  # Requires: python tools/prepare_models.py --mobilesam
  use_mobilesam: true
  encoder_path: models/mobile_sam/mobilesam_encoder.onnx
  decoder_path: models/mobile_sam/mobilesam_decoder.onnx

# ---------------------------------------------------------------------------
# YOLO (optional ROI helper) — ONNX Runtime CPU / OpenCV DNN. NO OpenVINO, NO CUDA.
# Only proposes crop boxes; identity always comes from ResNet18 retrieval.
# When depth is enabled, YOLO is visualization-only (detection overlay).
# ---------------------------------------------------------------------------
yolo:
  enabled: true
  backend: onnxruntime        # onnxruntime | opencv_dnn  (OpenVINO removed)
  model_path: models/yolov8n/yolov8n.onnx
  onnx_path: models/yolov8n/yolov8n.onnx
  device: cpu                  # CPU only
  allow_cpu_fallback: true
  precision: FP32              # FP32 on CPU (no FP16 on CPU EP)
  conf_threshold: 0.40
  nms_threshold: 0.45
  input_size: 640
  every_n_frames: 4            # detect ~7.5 FPS at 30 FPS UI  (>=5 FPS requirement)
  class_filter: null           # null = all COCO classes, or list e.g. [0, 41, 43]

# ---------------------------------------------------------------------------
# ResNet18 (ImageNet pretrained) — 选题一 feature extractor.
# avgpool 512-d, L2-normalized, cosine retrieval. ONNX Runtime CPU only.
# Only runs on identify / remember / search — never camera hot path.
# Prep: python tools/prepare_models.py --resnet18
# ---------------------------------------------------------------------------
resnet18:
  enabled: true
  backend: onnxruntime        # onnxruntime only (OpenVINO removed)
  model_path: models/resnet18/resnet18.onnx
  onnx_path: models/resnet18/resnet18.onnx
  device: cpu                  # CPU only
  allow_cpu_fallback: true
  precision: FP32              # FP32 on CPU (no FP16 on CPU EP)
  input_size: 224
  embed_dim: 512

# ---------------------------------------------------------------------------
# Object feature library — NumPy cosine similarity (no FAISS).
# known  : best score >= match_threshold → name + similarity
# unknown: best score <  match_threshold → 未知物体
#
# 0.6769 是【实测标定】值，不是拍脑袋的（2026-10-06）。
#   数据：data/dataset/ — 6 个录入物体 × 6 张注册图，3 张留出测试图
#                + 4 个未录入物体（香蕉/碗/雨伞/椅子）
#   实测：测试集 top-1 命中率 100% (18/18)
#        正样本余弦 min=0.7177 mean=0.7940
#        负样本余弦 max=0.6361 mean=0.5646
#        → 正负分布完全分离，中间 0.0816 空隙，0.6769 取中点使两侧余量相等
#   标定：python tools/eval_dataset.py --apply
#   注：碗(0.586→马克杯) / 椅子 / 香蕉 是最难的负样本，说明「形状近似
#      但类别不同」正是 ResNet18 分类特征的薄弱点。
# ---------------------------------------------------------------------------
memory:
  db_path: data/visual_memory.db
  samples_dir: data/samples
  embeddings_path: data/resnet18_embeddings.npz
  match_threshold: 0.6769
  # Centred features use a different scale; reject weak matches by default.
  match_threshold_centered: 0.5
  topk: 3
  min_samples: 3
  max_samples: 10
  sample_duration_sec: 2.5
  # Extend collection if CPU inference leaves fewer than min_samples; total limit.
  sample_timeout_sec: 15.0
  sample_interval_ms: 250
  min_crop_px: 64
  # enrollment / identify uses central ROI when YOLO has no reliable box
  center_roi_frac: 0.45

# ---------------------------------------------------------------------------
# ASR — sherpa-onnx Paraformer Chinese, CPU INT8 + Silero/sherpa VAD
# ---------------------------------------------------------------------------
asr:
  enabled: true
  model_dir: models/sherpa-onnx-paraformer-zh-int8
  tokens: models/sherpa-onnx-paraformer-zh-int8/tokens.txt
  e2e_model: models/sherpa-onnx-paraformer-zh-int8/model.int8.onnx
  encoder: models/sherpa-onnx-paraformer-zh-int8/model.int8.onnx
  decoder: models/sherpa-onnx-paraformer-zh-int8/decoder.int8.onnx
  cmvn: models/sherpa-onnx-paraformer-zh-int8/am.mvn
  vad_model: models/silero_vad/silero_vad.onnx
  sample_rate: 16000
  num_threads: 4
  max_end_silence_ms: 2500     # wait 2.5s after last speech before finalizing (was 800ms, cut off mid-sentence)
  min_speech_ms: 250
  device: cpu

# ---------------------------------------------------------------------------
# TTS — GPT-SoVITS as INDEPENDENT module/process. Vision never waits on TTS.
# mode: gpt_sovits | mock   (mock = silent/local test without GPT-SoVITS)
#
# 前置：先在**另一个终端**启动 TTS 服务器（不能用 vision_ai 环境，它没有 torchaudio）
#     tools\start_tts_server.bat
#     或 python -m voice.tts_server --gpt-sovits-path E:/GPT-SoVITS --port 19880 ^
#            --device cpu --ref-audio models/gpt_sovits/ref_audio.wav ^
#            --prompt-text "<与参考音频内容一致的文本>" --preload
# 实测（2026-10-06，CPU / FP32，s1v3+s2Gv3+中文HuBERT）：
#     首次（含懒加载）RTF 4.90；热态平均 RTF 1.29→ 交互可接受
#     引擎常驻约 2GB，但独立进程，视觉侧 30FPS 不受影响
# ---------------------------------------------------------------------------
tts:
  enabled: true
  # edge     : 微软 Edge TTS。延迟低（实测 ~1.8s 首句含联网）、音色自然，
  #            需联网，不占本地算力。
  # gpt_sovits: 本地 GPT-SoVITS 进程。完全离线但 CPU 上 RTF≈1.3，较慢。
  # mock     : 无声长鸣，仅测试用。
  mode: edge
  server_url: http://127.0.0.1:19880
  # ---- Edge TTS 参数（mode=edge 时生效）----
  # 可选：Yunxi(男,年轻) / Yunjian(男,播音) / Yunyang(男,解说) / Yunxia(男,童声)
  #       Xiaoxiao(女,自然) / Xiaoyi(女,活泼) / liaoning-Xiaobei / shaanxi-Xiaoni
  edge_voice: zh-CN-YunxiNeural
  edge_rate: "+0%"              # 语速，"-10%" 更慢
  edge_pitch: "+0Hz"
  ref_audio: models/gpt_sovits/ref_audio.wav
  # 必须与 ref_audio 的**实际说话内容**逐字一致，否则音色/韵律会变差
  prompt_text: "对我做了介绍啊那么我想说的话是呢大家如果对我的研究感兴趣呢你"
  prompt_lang: zh
  timeout_s: 30
  play_audio: true
  mock_wav: data/tts_beep.wav

# ---------------------------------------------------------------------------
# Intent parser — pure offline rule-based Chinese NLU
# ---------------------------------------------------------------------------
nlu:
  min_confidence: 0.6
