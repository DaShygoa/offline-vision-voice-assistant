<!DOCTYPE html>
<html lang="zh">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>离线物体识别 Demo</title>
<style>
  * { margin:0; padding:0; box-sizing:border-box; }
  body { background:#0f1117; color:#e2e8f0; font-family:"Microsoft YaHei",-apple-system,sans-serif; height:100vh; display:flex; flex-direction:column; overflow:hidden; }

  /* ── top status bar ── */
  .topbar { background:#1a1d27; padding:0 20px; height:48px; display:flex; align-items:center; justify-content:space-between; border-bottom:1px solid #2a2d3a; flex-shrink:0; }
  .topbar .brand { font-size:15px; font-weight:500; }
  .topbar .brand span { color:#818cf8; }
  .topbar .stats { display:flex; gap:14px; align-items:center; }
  .stat-chip { background:#252836; border-radius:6px; padding:4px 10px; font-size:11px; display:flex; align-items:center; gap:5px; }
  .stat-chip .dot { width:6px; height:6px; border-radius:50%; background:#34d399; }
  .stat-chip .dot.off { background:#f87171; }
  .stat-chip .val { color:#94a3b8; } .stat-chip .val b { color:#e2e8f0; font-weight:500; }
  .fps-badge { background:#312e81; color:#a5b4fc; padding:3px 12px; border-radius:12px; font-size:12px; font-weight:500; }
  .recog-btn { background:#065f46; color:#a7f3d0; border:1px solid #10b981; border-radius:6px; padding:4px 14px; font-size:12px; font-weight:500; cursor:pointer; font-family:inherit; white-space:nowrap; }
  .recog-btn:hover { background:#047857; color:#fff; }
  .recog-btn.paused { background:#7f1d1d; color:#fecaca; border-color:#ef4444; }
  .recog-btn.paused:hover { background:#991b1b; color:#fff; }
  .recog-btn:disabled { opacity:.5; cursor:not-allowed; }
  .dev-chip { background:#252836; color:#94a3b8; border:1px solid #2a2d3a; border-radius:6px; padding:4px 10px; font-size:11px; cursor:pointer; display:flex; align-items:center; gap:5px; font-family:inherit; }
  .dev-chip .dot { width:6px; height:6px; border-radius:50%; background:#34d399; }
  .dev-chip.off { color:#64748b; }
  .dev-chip.off .dot { background:#64748b; }
  .dev-chip:hover { border-color:#4f46e5; color:#c7d2fe; }
  .dev-btn { background:#252836; color:#94a3b8; border:1px solid #2a2d3a; border-radius:6px; padding:4px 10px; font-size:11px; cursor:pointer; display:flex; align-items:center; gap:5px; font-family:inherit; white-space:nowrap; }
  .dev-btn:hover { border-color:#4f46e5; color:#c7d2fe; }
  .dev-btn svg { flex-shrink:0; }

  /* ── device picker modal ── */
  .modal-backdrop { position:fixed; inset:0; background:rgba(6,8,14,.74); z-index:60; display:none; align-items:center; justify-content:center; padding:24px; }
  .modal-backdrop.show { display:flex; }
  .modal { width:540px; max-width:100%; max-height:100%; overflow-y:auto; background:#1a1d27; border:1px solid #343a4d; border-radius:14px; box-shadow:0 24px 70px rgba(0,0,0,.6); padding:20px 22px 18px; }
  .modal::-webkit-scrollbar { width:6px; } .modal::-webkit-scrollbar-thumb { background:#2a2d3a; border-radius:3px; }
  .modal-head { display:flex; align-items:center; justify-content:space-between; }
  .modal-head h2 { font-size:16px; font-weight:600; }
  .modal-close { background:transparent; border:none; color:#94a3b8; font-size:22px; line-height:1; cursor:pointer; padding:0 4px; font-family:inherit; }
  .modal-close:hover { color:#fff; }
  .modal-note { font-size:11px; color:#64748b; line-height:1.65; margin:8px 0 4px; }
  .dev-group { border-top:1px solid #262b3a; padding:14px 0 2px; }
  .dev-group .grp-head { display:flex; align-items:center; justify-content:space-between; margin-bottom:9px; }
  .dev-group h3 { font-size:12px; color:#cbd5e1; font-weight:600; }
  .grp-tools { display:flex; align-items:center; gap:10px; }
  .chk { display:flex; align-items:center; gap:5px; font-size:11px; color:#94a3b8; cursor:pointer; white-space:nowrap; }
  .chk input { accent-color:#6366f1; cursor:pointer; margin:0; }
  .mini-btn { background:#252836; color:#a5b4fc; border:1px solid #2a2d3a; border-radius:6px; padding:4px 10px; font-size:11px; cursor:pointer; font-family:inherit; }
  .mini-btn:hover { border-color:#4f46e5; }
  .mini-btn:disabled { opacity:.5; cursor:not-allowed; }
  .dev-select { width:100%; background:#0f1117; color:#e2e8f0; border:1px solid #2a2d3a; border-radius:8px; padding:9px 10px; font-size:12px; font-family:inherit; outline:none; }
  .dev-select:focus { border-color:#818cf8; }
  .dev-select option, .dev-select optgroup { background:#0f1117; color:#e2e8f0; }
  .dev-hint { font-size:11px; color:#64748b; margin-top:7px; line-height:1.55; min-height:15px; }
  .cam-preview { display:flex; gap:12px; align-items:center; margin-top:10px; }
  .cam-preview img { width:176px; height:99px; flex-shrink:0; object-fit:contain; background:#000; border:1px solid #2a2d3a; border-radius:8px; }
  .cam-preview .txt { font-size:11px; color:#64748b; line-height:1.6; }
  .modal-msg { font-size:11px; margin-top:14px; min-height:16px; line-height:1.5; }
  .modal-msg.ok { color:#6ee7b7; } .modal-msg.err { color:#fca5a5; } .modal-msg.info { color:#94a3b8; }
  .modal-foot { display:flex; justify-content:flex-end; gap:8px; margin-top:16px; padding-top:14px; border-top:1px solid #262b3a; }
  .btn-ghost { background:transparent; color:#94a3b8; border:1px solid #343a4d; border-radius:8px; padding:8px 18px; font-size:12px; cursor:pointer; font-family:inherit; }
  .btn-ghost:hover { color:#e2e8f0; border-color:#64748b; }
  .btn-primary { background:#4f46e5; color:#fff; border:none; border-radius:8px; padding:8px 20px; font-size:12px; font-weight:500; cursor:pointer; font-family:inherit; }
  .btn-primary:hover { background:#6366f1; }
  .btn-primary:disabled { opacity:.5; cursor:not-allowed; }

  /* ── main row: video + right panel ── */
  .main { flex:1; display:flex; overflow:hidden; }

  /* left: camera (takes most space) */
  .video-area { flex:1; padding:16px; display:flex; flex-direction:column; }
  .video-wrap { flex:1; border-radius:12px; overflow:hidden; background:#000; position:relative; }
  .video-wrap img { width:100%; height:100%; object-fit:contain; }
  .video-label { position:absolute; top:10px; left:12px; background:rgba(0,0,0,0.6); color:#94a3b8; font-size:11px; padding:3px 10px; border-radius:4px; }
  .candidate-overlay { position:absolute; inset:0; width:100%; height:100%; pointer-events:none; }
  .candidate-toggle { position:absolute; top:10px; right:12px; background:rgba(0,0,0,0.72); border-radius:6px; padding:6px 9px; color:#e2e8f0; }
  .candidate-toggle input { accent-color:#818cf8; }

  /* right panel */

  /* right: depth heatmap at TOP */

  .depth-box h3 { font-size:12px; color:#94a3b8; margin-bottom:8px; font-weight:500; }
  .depth-box .thumb { border-radius:10px; overflow:hidden; background:#000; height:200px; position:relative; }
  .depth-box .thumb img { width:100%; height:100%; object-fit:contain; }
  .depth-box .tag { position:absolute; bottom:8px; left:10px; background:rgba(0,0,0,0.6); color:#94a3b8; font-size:10px; padding:2px 8px; border-radius:3px; }

  /* right: object manager */
  .obj-section { flex:1; overflow-y:auto; padding:10px 0; }
  .obj-section h3 { font-size:12px; color:#94a3b8; padding:6px 18px 8px; font-weight:500; }
  .obj-heading { display:flex; align-items:center; justify-content:space-between; padding-right:18px; }
  .obj-section::-webkit-scrollbar { width:4px; }
  .obj-section::-webkit-scrollbar-thumb { background:#2a2d3a; border-radius:2px; }
  .obj-item { display:flex; align-items:center; justify-content:space-between; padding:8px 18px; }
  .obj-item:hover { background:#1e2230; }
  .obj-item .name { font-size:13px; font-weight:500; }
  .obj-item .meta { font-size:10px; color:#64748b; }
  .obj-item .del { background:transparent; color:#f87171; border:1px solid #7f1d1d; border-radius:5px; padding:2px 10px; font-size:10px; cursor:pointer; }
  .obj-item .del:hover { background:#7f1d1d; color:#fff; }
  .obj-item .ren { background:transparent; color:#60a5fa; border:1px solid #1e3a5f; border-radius:5px; padding:2px 10px; font-size:10px; cursor:pointer; margin-right:4px; }

  .obj-item .thumb { width:46px; height:46px; border-radius:6px; object-fit:cover; background:#0a1628; border:1px solid #2a2d3a; cursor:pointer; flex-shrink:0; }
  .obj-item .thumb:hover { border-color:#6366f1; }

  /* right: quick commands */
  .cmd-section { border-top:1px solid #1e2230; padding:12px 16px; }
  .cmd-section .quick-row { display:flex; gap:6px; flex-wrap:wrap; }

  .cmd-section .quick-row button:hover { color:#a5b4fc; border-color:#4f46e5; }

  .chat-messages::-webkit-scrollbar { width:4px; }
  .chat-messages::-webkit-scrollbar-thumb { background:#2a2d3a; border-radius:2px; }
  .chat-msg { padding:8px 14px; border-radius:14px; font-size:13px; line-height:1.55; max-width:55%; word-break:break-all; }
  .chat-msg.user { background:#4338ca; color:#e0e7ff; align-self:flex-end; border-bottom-right-radius:3px; }
  .chat-msg.bot { background:#2a2e3d; color:#e2e8f0; align-self:flex-start; border-bottom-left-radius:3px; }
  .chat-msg .tag { display:block; font-size:10px; margin-bottom:2px; opacity:0.7; }
  .chat-msg.user .tag { color:#a5b4fc; }
  .chat-msg.bot .tag { color:#818cf8; }
  .chat-msg.sys { background:transparent; color:#64748b; font-size:11px; align-self:center; padding:2px 0; }
  .chat-input-row { display:flex; gap:10px; align-items:center; padding:10px 0 14px; border-top:1px solid #1e2230; }
  .chat-input-row input { flex:1; background:#1e2230; border:1px solid #2a2d3a; border-radius:10px; padding:11px 16px; color:#e2e8f0; font-size:13px; outline:none; }
  .chat-input-row input:focus { border-color:#818cf8; }
  .chat-input-row button { background:#4f46e5; color:#fff; border:none; border-radius:10px; padding:11px 24px; font-size:13px; cursor:pointer; font-weight:500; }
  .chat-input-row button:hover { background:#6366f1; }
</style>
</head>

<script>
function addMsg(type, text, tag) {
  const el = document.getElementById('chat-messages');
  const div = document.createElement('div');
  div.className = 'chat-msg ' + type;
  if (tag) div.innerHTML = `<span class="tag">${tag}</span>${text}`;
  else div.textContent = text;
  el.appendChild(div);
  el.scrollTop = el.scrollHeight;
  return div;
}

let loadingEl = null;
function showLoading(text) {
  hideLoading();
  loadingEl = addMsg('bot', text || '正在识别…', '助手');
  loadingEl.style.opacity = '0.55';
}
function hideLoading() {
  if (loadingEl) { loadingEl.remove(); loadingEl = null; }
}

let lastReply = '', lastSubtitle = '';
let chatSince = 0;

async function pollChat() {
  try {
    const res = await fetch('/chat?since=' + chatSince);
    const data = await res.json();
    if (data.messages && data.messages.length) {
      for (const m of data.messages) {
        if (m.role === 'user') {
          hideLoading();
          addMsg('user', m.text, m.source === 'text' ? '你' : '语音');
          showLoading('正在识别…');
        } else if (m.role === 'bot') {
          hideLoading();
          addMsg('bot', m.text, '助手');
          if (/记住|录入|删除|重命名|已忘|忘记/.test(m.text)) refreshObjects();
        } else {
          addMsg('sys', m.text);
        }
      }
      chatSince = data.now;
    }
  } catch(e) {}
  setTimeout(pollChat, 400);
}

async function sendCmd() {
  const input = document.getElementById('cmd-input');
  const text = input.value.trim();
  if (!text) return;
  input.value = '';
  input.placeholder = '输入指令… 如：这是什么？';
  showLoading('正在识别…');
  try {
    const res = await fetch('/command', {method:'POST', headers:{'Content-Type':'application/json'}, body:JSON.stringify({text})});
    if (!res.ok) throw new Error('command failed');
  } catch(e) { hideLoading(); addMsg('sys', '发送失败，请重试'); }
}

function quickCmd(text) {
  document.getElementById('cmd-input').value = text;
  sendCmd();
}

function syncRecognitionBtn(enabled) {
  const b = document.getElementById('recog-btn');
  if (!b) return;
  b.textContent = enabled ? '暂停识别' : '开始识别';
  b.className = 'recog-btn' + (enabled ? '' : ' paused');
}

function syncDeviceChip(id, on) {
  const el = document.getElementById(id);
  if (!el) return;
  el.className = 'dev-chip' + (on ? '' : ' off');
}

async function toggleDevice(kind) {
  try {
    const res = await fetch('/' + kind, {
      method: 'POST',
      headers: {'Content-Type': 'application/json'},
      body: JSON.stringify({})
    });
    const d = await res.json();
    if (kind === 'camera') syncDeviceChip('chip-cam', !!d.camera_enabled);
    else syncDeviceChip('chip-mic', !!d.mic_enabled);
  } catch(e) { /* keep previous state */ }
}

async function toggleRecognition() {
  const b = document.getElementById('recog-btn');
  b.disabled = true;
  try {
    const res = await fetch('/recognition', {
      method: 'POST',
      headers: {'Content-Type': 'application/json'},
      body: JSON.stringify({})
    });
    const d = await res.json();
    syncRecognitionBtn(!!d.enabled);
    syncDeviceChip('chip-cam', !!d.camera_enabled);
    syncDeviceChip('chip-mic', !!d.mic_enabled);
  } catch(e) {
    /* keep the previous state on network failure */
  } finally {
    b.disabled = false;
  }
}

// "记住这个" needs a name from the user — pre-fill the command stem and let
// them type the object name, then hit Enter.
function startRemember() {
  const input = document.getElementById('cmd-input');
  input.value = '记住这个是';
  input.placeholder = '输入物体名字后按回车…';
  input.focus();
  const end = input.value.length;
  input.setSelectionRange(end, end);
}

async function refreshObjects() {
  try {
    const res = await fetch('/objects');
    const data = await res.json();
    importMin = data.min_samples || 3; importMax = data.max_samples || 10;
    const el = document.getElementById('obj-list');
    if (!data.objects || !data.objects.length) { el.innerHTML = '<div class="obj-empty">识别库为空</div>'; return; }
    el.replaceChildren();
    for (const o of data.objects) {
      const item = document.createElement('div'); item.className = 'obj-item'; item.dataset.name = o.name;
      if (o.images) {
        const img = document.createElement('img'); img.className = 'thumb'; img.alt = '录入样本'; img.title = '查看录入样本';
        img.src = '/objects/sample?name=' + encodeURIComponent(o.name) + '&index=0&t=' + Date.now();
        img.onclick = () => viewSample(o.name); item.appendChild(img);
      }
      const info = document.createElement('div'), name = document.createElement('div'), meta = document.createElement('div');
      name.className = 'name'; name.textContent = o.name; meta.className = 'meta'; meta.textContent = o.samples + ' 个样本';
      info.append(name, meta); item.appendChild(info);
      const btns = document.createElement('div'); btns.className = 'btns';
      const rename = document.createElement('button'); rename.className = 'ren'; rename.textContent = '重命名'; rename.onclick = () => startRename(o.name);
      const del = document.createElement('button'); del.className = 'del'; del.textContent = '删除'; del.onclick = () => deleteObject(o.name);
      btns.append(rename, del); item.appendChild(btns); el.appendChild(item);
    }
  } catch(e) {}
}

// Open the enrolled sample images in a new tab so the user can verify quality.
function viewSample(name) {
  window.open('/objects/sample?name=' + encodeURIComponent(name) + '&index=0', '_blank');
}

function startRename(oldName) {
  const item = document.querySelector(`.obj-item[data-name="${CSS.escape(oldName)}"]`);
  if (!item) return;
  const nameEl = item.querySelector('.name');
  const inp = document.createElement('input'); inp.className = 'ren-input'; inp.value = oldName;
  inp.onkeydown = event => { if (event.key === 'Enter') commitRename(inp, oldName); if (event.key === 'Escape') refreshObjects(); };
  nameEl.replaceChildren(inp);
  inp.focus();
  inp.select();
}

let importMin = 3, importMax = 10, importing = false;
function openImportModal() {
  document.getElementById('import-form').reset();
  document.getElementById('import-msg').textContent = '';
  document.getElementById('import-hint').textContent = `选择 ${importMin} 到 ${importMax} 张同一物体不同角度的图片，建议主体清晰、占满画面。单张不超过 10 MB，总计不超过 50 MB。`;
  document.getElementById('import-modal').classList.add('show');
  document.getElementById('import-name').focus();
}
function closeImportModal() {
  if (!importing) document.getElementById('import-modal').classList.remove('show');
}
async function submitImport(event) {
  event.preventDefault();
  if (importing) return;
  const name = document.getElementById('import-name').value.trim();
  const files = document.getElementById('import-files').files;
  const msg = document.getElementById('import-msg');
  if (!name || files.length < importMin || files.length > importMax) {
    msg.textContent = `请输入名称并选择 ${importMin} 到 ${importMax} 张图片。`; msg.className = 'modal-msg err'; return;
  }
  const body = new FormData(); body.append('name', name);
  for (const file of files) body.append('images', file);
  importing = true; document.getElementById('import-submit').disabled = true;
  msg.textContent = '正在导入，请稍候…'; msg.className = 'modal-msg info';
  try {
    const res = await fetch('/objects/import', {method:'POST', body});
    const data = await res.json();
    if (!res.ok || !data.ok) throw new Error(data.error || '导入失败');
    importing = false; closeImportModal(); addMsg('sys', data.message); await refreshObjects();
  } catch (e) { msg.textContent = e.message || '导入失败，请重试。'; msg.className = 'modal-msg err'; }
  finally { importing = false; document.getElementById('import-submit').disabled = false; }
}

async function commitRename(inputEl, oldName) {
  const newName = inputEl.value.trim();
  if (!newName || newName === oldName) { refreshObjects(); return; }
  try {
    const res = await fetch('/objects/rename', {
      method: 'POST',
      headers: {'Content-Type': 'application/json'},
      body: JSON.stringify({old_name: oldName, new_name: newName})
    });
    const data = await res.json();
    if (!data.ok) { alert(data.error || '重命名失败'); }
    refreshObjects();
  } catch(e) { refreshObjects(); }
}

async function deleteObject(name) {
  if (!confirm(`确定删除「${name}」？`)) return;
  try {
    await fetch('/objects/delete', {method:'POST', headers:{'Content-Type':'application/json'}, body:JSON.stringify({name})});
    refreshObjects(); addMsg('sys', `已删除「${name}」`);
  } catch(e) {}
}

let candidateSnapshot = null;
function renderCandidates() {
  const svg = document.getElementById('candidate-overlay');
  svg.replaceChildren();
  const data = candidateSnapshot;
  if (!document.getElementById('show-candidates').checked || !data || !data.width || !data.height) return;
  svg.setAttribute('viewBox', `0 0 ${data.width} ${data.height}`);
  const unit = data.width / 960;
  const ns = 'http://www.w3.org/2000/svg';
  const reasons = {too_far:'已过滤：距离较远', no_crop:'无法裁剪', quality_fail:'画面质量不足',
    face_rejected:'已过滤：疑似人脸', too_large:'已过滤：区域过大', no_embed:'特征提取失败', no_match:'无匹配结果'};
  data.boxes.forEach((candidate, index) => {
    const box = candidate.box;
    const x = box[0], y = box[1];
    const rect = document.createElementNS(ns, 'rect');
    rect.setAttribute('x', x); rect.setAttribute('y', y);
    rect.setAttribute('width', Math.max(0, box[2] - box[0]));
    rect.setAttribute('height', Math.max(0, box[3] - box[1]));
    rect.setAttribute('fill', 'none'); rect.setAttribute('stroke', '#60a5fa'); rect.setAttribute('stroke-width', '3');
    rect.setAttribute('vector-effect', 'non-scaling-stroke');
    const text = document.createElementNS(ns, 'text');
    const detail = candidate.name != null && typeof candidate.score === 'number'
      ? `候选：${candidate.name} 原始 ${(candidate.score * 100).toFixed(1)}%` +
        (typeof candidate.decision_score === 'number' ? ` 中心化 ${(candidate.decision_score * 100).toFixed(1)}%` : '')
      : (reasons[candidate.reason] || '无匹配结果');
    const label = `C${index + 1} ${detail}`;
    text.setAttribute('x', Math.max(3 * unit, Math.min(x + 3 * unit, data.width - (5 + label.length * 16) * unit)));
    text.setAttribute('y', Math.max(18 * unit, y - 5 * unit));
    text.setAttribute('fill', '#93c5fd'); text.setAttribute('font-size', 16 * unit);
    text.setAttribute('stroke', '#111827'); text.setAttribute('stroke-width', 3 * unit);
    text.setAttribute('paint-order', 'stroke'); text.textContent = label;
    if (label.length * 16 > 940) { text.setAttribute('textLength', 940 * unit); text.setAttribute('lengthAdjust', 'spacingAndGlyphs'); }
    svg.append(rect, text);
  });
}

async function pollStatus() {
  try {
    const res = await fetch('/status');
    const s = await res.json();
    if (s.ready) {
      candidateSnapshot = s.candidate_boxes || null; renderCandidates();
      document.getElementById('fps-badge').textContent = (s.fps||'--') + ' FPS';
      syncRecognitionBtn(s.recognition_enabled !== false);
      syncDeviceChip('chip-cam', s.camera_enabled !== false);
      syncDeviceChip('chip-mic', s.mic_enabled !== false);
      const resolution = s.camera_width && s.camera_height ? ` · ${s.camera_width}×${s.camera_height}` : '';
      document.getElementById('chip-cam').title = '开关摄像头 · 当前：' + (s.camera_label || ('索引 ' + s.camera_index)) + resolution;
      document.getElementById('chip-mic').title = '开关麦克风 · 当前：' + (s.mic_label || '系统默认');
      document.getElementById('s-resnet').textContent = s.resnet18==='off'?'OFF':'CPU';
      document.getElementById('s-depth').textContent = s.depth==='off'?'OFF':'CPU';
      document.getElementById('s-mem').textContent = s.mem_objects;
      const asrEl = document.getElementById('s-asr');
      const asrDot = document.getElementById('dot-asr');
      if (!s.voice_enabled) { asrEl.textContent = 'OFF'; asrDot.className = 'dot off'; }
      else if (s.asr_latency_ms > 0) { asrEl.textContent = s.asr_latency_ms + 'ms'; asrDot.className = 'dot'; }
      else { asrEl.textContent = '就绪'; asrDot.className = 'dot'; }
      document.getElementById('dot-resnet').className = 'dot'+(s.resnet18!=='off'?'':' off');
      document.getElementById('dot-depth').className = 'dot'+(s.depth!=='off'?'':' off');
      if (s.last_reply && s.last_reply !== lastReply) { lastReply = s.last_reply; }
    }
  } catch(e) {}
  setTimeout(pollStatus, 500);
}
// ═══════════════════ device picker ═══════════════════
let devOpen = false, devData = null, devReq = 0, devPoll = null, devPreviewDone = false;
let previewSeq = 0;
let devChoice = {camera: undefined, mic: undefined};

function escHtml(s) {
  return String(s == null ? '' : s).replace(/[&<>"']/g, c => ({
    '&':'&amp;', '<':'&lt;', '>':'&gt;', '"':'&quot;', "'":'&#39;'
  }[c]));
}
function setDevMsg(text, kind) {
  const el = document.getElementById('dev-msg');
  el.textContent = text || '';
  el.className = 'modal-msg' + (kind ? ' ' + kind : '');
}
function micValOf(v) { return (v === null || v === undefined || v === '') ? '' : String(v); }

function openDeviceModal() {
  devOpen = true; devReq++;
  devChoice = {camera: undefined, mic: undefined};
  devPreviewDone = false;
  document.getElementById('dev-modal').classList.add('show');
  setDevMsg('', '');
  loadDevices(true);
}
function closeDeviceModal() {
  devOpen = false; devReq++;
  if (devPoll) { clearTimeout(devPoll); devPoll = null; }
  stopCamPreview();
  document.getElementById('dev-modal').classList.remove('show');
}

// Free the preview capture on the server: DirectShow devices are exclusive,
// so leaving a stream open would block the next camera switch.
function stopCamPreview() {
  document.getElementById('cam-preview-img').removeAttribute('src');
  fetch('/devices/preview/stop', {method:'POST'}).catch(()=>{});
}
function onMicAllChange() { loadDevices(false); }

// A rescan opens every camera index; release the preview capture first so it
// does not compete with the probe, then reconnect once the scan is done.
function refreshDevices() {
  stopCamPreview();
  devPreviewDone = false;
  loadDevices(true);
}

async function loadDevices(refresh) {
  const myReq = ++devReq;
  try {
    const params = new URLSearchParams();
    if (refresh) params.set('refresh', '1');
    if (document.getElementById('mic-all').checked) params.set('all_mics', '1');
    const qs = params.toString();
    const res = await fetch('/devices' + (qs ? '?' + qs : ''));
    const d = await res.json();
    if (!devOpen || myReq !== devReq) return;   // modal closed / newer request
    devData = d;
    renderDevices(d);
    const ci = d.camera_info || {};
    let camHint = d.scanning ? '正在扫描摄像头（逐个打开约需数秒）…'
       : (d.cameras.length
            ? '检测到 ' + d.cameras.length + ' 个摄像头 · ' + (ci.named ? '名称来自 DirectShow 设备枚举' : '按 OpenCV 索引排列')
            : '未检测到可用摄像头');
    if (d.camera_width && d.camera_height) camHint += ` · 当前画面 ${d.camera_width}×${d.camera_height}`;
    if (!d.scanning && ci.unavailable) {
      camHint += ' · ' + ci.unavailable + ' 个设备当前打不开（被占用 / 未启动），仍保留在列表中';
    }
    if (d.scan_error) camHint += ' · ' + d.scan_error;
    document.getElementById('cam-hint').textContent = camHint;
    const mi = d.mic_info || {};
    document.getElementById('mic-hint').textContent = d.microphones.length
      ? (mi.compact
          ? '显示 ' + d.microphones.length + ' 个麦克风 · 已跨驱动合并 ' + (mi.hidden || 0) + ' 个重复 / 别名项（优先 ' + (mi.preferred_host || '首选驱动') + '）'
          : '显示全部 ' + d.microphones.length + ' 个输入设备（含各驱动的重复项）')
      : '未检测到输入设备（可检查系统录音权限）';
    document.getElementById('cam-refresh').disabled = !!d.scanning;
    document.getElementById('mic-refresh').disabled = !!d.scanning;
    if (d.scanning) {
      devPoll = setTimeout(() => loadDevices(false), 700);
    } else {
      devPoll = null;
      if (!devPreviewDone) { devPreviewDone = true; updateCamPreview(); }
    }
  } catch(e) {
    if (devOpen) setDevMsg('读取设备列表失败：' + e.message, 'err');
  }
}

function renderDevices(d) {
  const camSel = document.getElementById('cam-select');
  const micSel = document.getElementById('mic-select');
  const curCam = String(d.camera_index ?? 0);
  const curMic = micValOf(d.mic_device);
  if (devChoice.camera === undefined) devChoice.camera = curCam;
  if (devChoice.mic === undefined) devChoice.mic = curMic;

  const cams = (d.cameras || []).slice().sort((a,b) => Number(a.id) - Number(b.id));
  if (!cams.some(c => String(c.id) === curCam)) {
    cams.unshift({id: Number(curCam), name: '摄像头 ' + curCam, detail: '当前设备', in_use: true});
  }
  camSel.innerHTML = cams.map(c =>
    `<option value="${escHtml(c.id)}">${escHtml(c.name)}${c.detail ? ' · ' + escHtml(c.detail) : ''}${c.in_use ? '（当前）' : ''}${c.available === false ? '（不可用）' : (c.readable === false ? '（无画面）' : '')}</option>`
  ).join('') || '<option value="">未检测到摄像头</option>';
  if ([...camSel.options].some(o => o.value === String(devChoice.camera))) camSel.value = String(devChoice.camera);

  // Compact view usually contains a single host API, so only add optgroups
  // when "显示全部驱动设备" is on and several APIs are present.
  const mics = d.microphones || [];
  const opt = m => `<option value="${escHtml(m.id)}">${escHtml(m.name)}${m.detail ? ' · ' + escHtml(m.detail) : ''}${m.is_alias ? '（别名/回环）' : ''}${m.is_default ? '（系统默认）' : ''}${m.is_current ? '（当前）' : ''}</option>`;
  let html = `<option value="">系统默认输入设备${curMic === '' ? '（当前）' : ''}</option>`;
  const hosts = [...new Set(mics.map(m => m.host || '其他'))];
  if (hosts.length > 1) {
    for (const host of hosts) {
      html += `<optgroup label="${escHtml(host)}">` +
        mics.filter(m => (m.host || '其他') === host).map(opt).join('') + '</optgroup>';
    }
  } else {
    html += mics.map(opt).join('');
  }
  if (curMic !== '' && !mics.some(m => String(m.id) === curMic)) {
    html += `<option value="${escHtml(curMic)}">${escHtml(d.mic_label || ('设备 ' + curMic))}（当前）</option>`;
  }
  micSel.innerHTML = html;
  if ([...micSel.options].some(o => o.value === devChoice.mic)) micSel.value = devChoice.mic;
}

function onCamSelect() {
  devChoice.camera = document.getElementById('cam-select').value;
  updateCamPreview();
}
function onMicSelect() { devChoice.mic = document.getElementById('mic-select').value; }

function updateCamPreview() {
  const idx = document.getElementById('cam-select').value;
  const img = document.getElementById('cam-preview-img');
  const txt = document.getElementById('cam-preview-txt');
  if (idx === '') { stopCamPreview(); txt.textContent = '未选择摄像头。'; return; }
  const seq = ++previewSeq;
  txt.textContent = '正在连接实时预览…';
  img.style.opacity = '0.35';
  img.onload = () => {
    if (seq !== previewSeq) return;
    img.style.opacity = '1';
    txt.textContent = '摄像头 ' + idx + ' 的实时画面；点「应用切换」后左侧主画面会切过去。';
  };
  img.onerror = () => {
    if (seq !== previewSeq) return;
    img.style.opacity = '0.12';
    txt.textContent = '该设备当前无法实时预览（多半被主摄像头占用）。可直接点「应用切换」，左侧主画面会实时显示新设备；不合适再切回来。';
  };
  // MJPEG: the browser keeps the connection open and repaints every frame.
  img.src = '/devices/preview/stream?index=' + encodeURIComponent(idx) + '&t=' + Date.now();
}

async function applyDevices() {
  if (!devData) { setDevMsg('设备信息尚未加载完成，请稍候。', 'info'); return; }
  const camVal = document.getElementById('cam-select').value;
  const micVal = document.getElementById('mic-select').value;
  const curCam = String(devData.camera_index ?? 0);
  const curMic = micValOf(devData.mic_device);
  const payload = {};
  if (camVal !== '' && camVal !== curCam) payload.camera = Number(camVal);
  if (micVal !== curMic) {
    payload.mic = micVal === '' ? null : (Number.isNaN(Number(micVal)) ? micVal : Number(micVal));
  }
  if (!Object.keys(payload).length) { setDevMsg('设备未变化，无需切换。', 'info'); return; }

  const btn = document.getElementById('dev-apply');
  btn.disabled = true;
  setDevMsg('正在切换设备，画面 / 语音会短暂中断…', 'info');
  try {
    const res = await fetch('/devices', {
      method: 'POST', headers: {'Content-Type': 'application/json'}, body: JSON.stringify(payload)
    });
    const d = await res.json();
    devData = Object.assign({}, devData, d);
    if (d.ok) {
      const parts = [];
      if ('camera' in payload) parts.push('摄像头 → ' + (d.camera_label || payload.camera));
      if ('mic' in payload) parts.push('麦克风 → ' + (d.mic_label || '系统默认'));
      const msg = parts.join('；');
      setDevMsg('已切换：' + msg, 'ok');
      addMsg('sys', '设备已切换：' + msg);
      syncDeviceChip('chip-cam', !!d.camera_enabled);
      syncDeviceChip('chip-mic', !!d.mic_enabled);
      updateCamPreview();
      loadDevices(true);   // rescan so the "（当前）" marker follows the new device
    } else {
      const errs = Object.values(d.errors || {});
      setDevMsg(errs.length ? errs.join('；') : '切换失败，请重试。', 'err');
    }
  } catch(e) {
    setDevMsg('切换请求失败：' + e.message, 'err');
  } finally {
    btn.disabled = false;
  }
}

document.getElementById('dev-modal').addEventListener('click', e => {
  if (e.target && e.target.id === 'dev-modal') closeDeviceModal();
});
document.addEventListener('keydown', e => {
  if (e.key === 'Escape' && devOpen) closeDeviceModal();
});

refreshObjects(); pollStatus(); pollChat(); setInterval(refreshObjects, 3000);
